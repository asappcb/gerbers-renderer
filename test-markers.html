<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerbers Renderer Marker Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        #viewer-container {
            width: 800px;
            height: 600px;
            border: 1px solid #ccc;
            background: #f5f5f5;
        }
        .controls {
            margin: 10px 0;
        }
        button {
            margin: 5px;
            padding: 8px 16px;
        }
    </style>
</head>
<body>
    <h1>Gerbers Renderer Marker Smoke Test</h1>
    <div class="controls">
        <button onclick="addValidMarker()">Add Valid Marker</button>
        <button onclick="addInvalidMarker()">Add Invalid Marker</button>
        <button onclick="addMultipleMarkers()">Add Multiple Markers</button>
        <button onclick="toggleMarkers()">Toggle Markers</button>
        <button onclick="clearMarkers()">Clear Markers</button>
    </div>
    <div id="viewer-container"></div>

    <script type="module">
        import { createIntegratedViewer } from './dist/gerbers-renderer.es.js';

        let viewer;
        let markerCount = 0;

        function initViewer() {
            const container = document.getElementById('viewer-container');
            viewer = createIntegratedViewer(container);

            // Set up minimal board data
            viewer.setData({
                boardGeom: {
                    board: {
                        mm_bounds: {
                            min_x_mm: 0,
                            min_y_mm: 0,
                            max_x_mm: 100,
                            max_y_mm: 80
                        }
                    }
                },
                layers: {}
            });

            // Enable markers by default
            viewer.visibility.setMarkersVisibility(true);
            
            console.log('Viewer initialized');
        }

        window.addValidMarker = function() {
            markerCount++;
            const marker = {
                id: `valid-marker-${markerCount}`,
                x_mm: 20 + (markerCount * 5),
                y_mm: 30 + (markerCount * 3),
                severity: markerCount % 2 === 0 ? 'error' : 'warning',
                layer: markerCount % 2 === 0 ? 'top' : 'bottom',
                data: { test: true }
            };

            console.log('Adding valid marker:', marker);
            viewer.addMarker(marker);
        };

        window.addInvalidMarker = function() {
            markerCount++;
            const invalidMarkers = [
                { id: `invalid-${markerCount}-a` }, // Missing coordinates
                { id: `invalid-${markerCount}-b`, x_mm: undefined, y_mm: 25 }, // Undefined x
                { id: `invalid-${markerCount}-c`, x_mm: 15, y_mm: null }, // Null y
                { id: `invalid-${markerCount}-d`, x_mm: 'invalid', y_mm: 20 }, // String x
                { id: `invalid-${markerCount}-e`, x_mm: 10, y_mm: NaN } // NaN y
            ];

            const marker = invalidMarkers[markerCount % invalidMarkers.length];
            console.log('Adding invalid marker:', marker);
            viewer.addMarker(marker);
        };

        window.addMultipleMarkers = function() {
            const markers = [];
            for (let i = 0; i < 5; i++) {
                markerCount++;
                markers.push({
                    id: `batch-marker-${markerCount}`,
                    x_mm: 10 + (i * 15),
                    y_mm: 20 + (i * 10),
                    severity: ['error', 'warning', 'info'][i % 3],
                    layer: i % 2 === 0 ? 'top' : 'bottom'
                });
            }

            console.log('Adding multiple markers:', markers);
            viewer.addMarkers(markers);
        };

        window.toggleMarkers = function() {
            const current = viewer.visibility.getState().markers;
            viewer.visibility.setMarkersVisibility(!current);
            console.log(`Markers ${!current ? 'enabled' : 'disabled'}`);
        };

        window.clearMarkers = function() {
            viewer.markerRenderer.clear();
            viewer.viewer.requestRender('markers-cleared');
            console.log('Markers cleared');
        };

        // Initialize viewer when page loads
        initViewer();
    </script>
</body>
</html>
